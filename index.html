<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPTV & AceStream Hub</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f12;
      color: #f0f0f0;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Reproductor superior */
    header {
      background: #000;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .video-box {
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16 / 9;
      background: #050505;
    }
    video {
      width: 100%;
      height: 100%;
      display: block;
    }
    .player-info {
      width: 100%;
      max-width: 900px;
      padding: 10px 16px;
      background: #18181b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }
    .badge {
      background: #ff8800;
      color: #000;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 11px;
    }

    /* Barra de herramientas */
    .toolbar {
      max-width: 1200px;
      width: 100%;
      margin: 16px auto;
      padding: 0 16px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    input, select {
      padding: 10px 14px;
      background: #1e1e24;
      border: 1px solid #2e2e38;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    input { flex: 1; min-width: 200px; }
    input:focus, select:focus { border-color: #ff8800; }

    /* Parrilla de canales */
    .channels-grid {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 0 16px 40px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }
    .channel-card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .channel-card:hover {
      background: #27272a;
      border-color: #ff8800;
      transform: translateY(-2px);
    }
    .channel-logo {
      width: 48px;
      height: 48px;
      object-fit: contain;
      background: #09090b;
      border-radius: 6px;
      padding: 4px;
      flex-shrink: 0;
    }
    .channel-details {
      flex: 1;
      overflow: hidden;
    }
    .channel-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }
    .channel-epg {
      font-size: 12px;
      color: #a1a1aa;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .channel-group {
      font-size: 10px;
      color: #71717a;
      text-transform: uppercase;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <header>
    <div class="video-box">
      <video id="player" controls autoplay playsinline></video>
    </div>
    <div class="player-info">
      <div>
        <span id="now-playing" style="font-weight: bold;">Selecciona un canal</span>
        <span id="now-epg" style="color: #a1a1aa; margin-left: 8px;"></span>
      </div>
      <span id="status-badge" class="badge" style="display:none;">EN VIVO</span>
    </div>
  </header>

  <div class="toolbar">
    <input type="text" id="search" placeholder="Buscar canal o programa..." oninput="filtrarCanales()">
    <select id="group-filter" onchange="filtrarCanales()">
      <option value="">Todas las categorías</option>
    </select>
  </div>

  <div class="channels-grid" id="grid">
    <p style="padding: 20px; color: #888;">Cargando lista de canales y programación...</p>
  </div>

  <script>
    const ACE_SERVER_IP = '192.168.1.14';
    
    // URL original del JSON
    const RAW_CHANNELS_URL = 'https://git.gay/TokyoGhoulles/AceStream_IDs/raw/branch/main/hashes.json';
    // Pasa por proxy CORS para evitar el bloqueo del navegador
    const CHANNELS_JSON_URL = `https://corsproxy.io/?url=${encodeURIComponent(RAW_CHANNELS_URL)}`;
    
    // Feed EPG público compatible
    const EPG_API_URL = 'https://raw.githubusercontent.com/davidmuma/EPG_dobleM/master/guiatv.json';

    let listaCanales = [];
    let guiaEPG = {};
    let hls = null;

    async function init() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '<p style="padding: 20px; color: #888;">Cargando lista de canales y programación...</p>';

      try {
        let resCanalesData = null;

        // Intentar descargar canales con proxy primario
        try {
          const res = await fetch(CHANNELS_JSON_URL);
          resCanalesData = await res.json();
        } catch (e) {
          // Fallback con proxy secundario por si falla el primero
          const resFallback = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(RAW_CHANNELS_URL)}`);
          resCanalesData = await resFallback.json();
        }

        // Descarga de la guía EPG en paralelo
        try {
          const resEpg = await fetch(EPG_API_URL);
          guiaEPG = await resEpg.json();
        } catch (e) {
          console.warn('No se pudo cargar la EPG, se mostrará sin guía.', e);
        }

        if (resCanalesData && resCanalesData.hashes) {
          listaCanales = resCanalesData.hashes;
          poblarFiltroGrupos();
          renderizarCanales(listaCanales);
        } else {
          grid.innerHTML = '<p style="color:#f55; padding: 20px;">No se encontraron canales en el JSON.</p>';
        }
      } catch (err) {
        console.error(err);
        grid.innerHTML = '<p style="color:#f55; padding: 20px;">Error al conectar con la fuente de canales. Revisa la consola (F12).</p>';
      }
    }

    function normalizarTexto(texto) {
      return (texto || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function obtenerEPGActual(canal) {
      if (!guiaEPG || Object.keys(guiaEPG).length === 0) return 'Directo';

      const canalIdNorm = normalizarTexto(canal.tvg_id || canal.title);
      // Buscar coincidencia en la clave del objeto EPG
      const keyEpg = Object.keys(guiaEPG).find(k => normalizarTexto(k).includes(canalIdNorm) || canalIdNorm.includes(normalizarTexto(k)));

      if (!keyEpg || !guiaEPG[keyEpg]) return 'Emisión en directo';

      const ahora = new Date();
      const eventos = guiaEPG[keyEpg];

      if (!Array.isArray(eventos)) return 'Emisión en directo';

      const actual = eventos.find(ev => {
        const inicio = new Date(ev.start || ev.inicio);
        const fin = new Date(ev.end || ev.fin);
        return ahora >= inicio && ahora <= fin;
      });

      return actual ? (actual.title || actual.nombre || 'Directo') : 'Emisión en directo';
    }

    function poblarFiltroGrupos() {
      const grupos = [...new Set(listaCanales.map(c => c.group).filter(Boolean))].sort();
      const select = document.getElementById('group-filter');
      select.innerHTML = '<option value="">Todas las categorías</option>';
      grupos.forEach(g => {
        const opt = document.createElement('option');
        opt.value = g;
        opt.innerText = g;
        select.appendChild(opt);
      });
    }

    function renderizarCanales(canales) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      if (canales.length === 0) {
        grid.innerHTML = '<p style="color:#aaa; padding: 20px;">No se encontraron canales que coincidan con la búsqueda.</p>';
        return;
      }

      canales.forEach(canal => {
        const epgText = obtenerEPGActual(canal);
        const logoUrl = canal.logo || 'https://via.placeholder.com/48?text=TV';

        const card = document.createElement('div');
        card.className = 'channel-card';
        card.onclick = () => reproducir(canal, epgText);

        card.innerHTML = `
          <img class="channel-logo" src="${logoUrl}" onerror="this.src='https://via.placeholder.com/48?text=TV'" loading="lazy">
          <div class="channel-details">
            <div class="channel-title" title="${canal.title}">${canal.title}</div>
            <div class="channel-epg" title="${epgText}">📺 ${epgText}</div>
            <div class="channel-group">${canal.group || 'GENERAL'}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filtrarCanales() {
      const q = document.getElementById('search').value.toLowerCase();
      const grp = document.getElementById('group-filter').value;

      const filtrados = listaCanales.filter(c => {
        const coincideNombre = (c.title || '').toLowerCase().includes(q);
        const coincideGrupo = !grp || c.group === grp;
        return coincideNombre && coincideGrupo;
      });

      renderizarCanales(filtrados);
    }

    function reproducir(canal, epgText) {
      const video = document.getElementById('player');
      const streamUrl = `http://${ACE_SERVER_IP}:6878/ace/manifest.m3u8?id=${canal.hash}`;

      document.getElementById('now-playing').innerText = canal.title;
      document.getElementById('now-epg').innerText = `(${epgText})`;
      document.getElementById('status-badge').style.display = 'inline-block';

      window.scrollTo({ top: 0, behavior: 'smooth' });

      if (hls) hls.destroy();

      if (Hls.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        video.play();
      }
    }

    window.onload = init;
  </script>
</body>
</html>
