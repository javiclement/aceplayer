<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AceStream Web Hub</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0e12;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #000;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.8);
    }
    .video-box {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      display: block;
    }
    .player-info {
      width: 100%;
      max-width: 960px;
      padding: 10px 16px;
      background: #181920;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }
    .badge {
      background: #ff8800;
      color: #000;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 11px;
    }

    .toolbar {
      max-width: 1200px;
      width: 100%;
      margin: 16px auto;
      padding: 0 16px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    input, select {
      padding: 10px 14px;
      background: #181920;
      border: 1px solid #2d2e3a;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    input { flex: 1; min-width: 220px; }
    input:focus, select:focus { border-color: #ff8800; }

    .channels-grid {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 0 16px 40px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }
    .channel-card {
      background: #181920;
      border: 1px solid #262733;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .channel-card:hover {
      background: #20222c;
      border-color: #ff8800;
      transform: translateY(-2px);
    }
    .channel-logo {
      width: 48px;
      height: 48px;
      object-fit: contain;
      background: #0d0e12;
      border-radius: 6px;
      padding: 4px;
      flex-shrink: 0;
    }
    .channel-details {
      flex: 1;
      overflow: hidden;
    }
    .channel-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .channel-epg {
      font-size: 12px;
      color: #fb923c;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .channel-group {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <header>
    <div class="video-box">
      <video id="player" controls autoplay playsinline></video>
    </div>
    <div class="player-info">
      <div>
        <span id="now-playing" style="font-weight: bold;">Selecciona un canal</span>
        <span id="now-epg" style="color: #fb923c; margin-left: 8px; font-size: 13px;"></span>
      </div>
      <span id="status-badge" class="badge" style="display:none;">EN VIVO</span>
    </div>
  </header>

  <div class="toolbar">
    <input type="text" id="search" placeholder="Buscar canal o programa..." oninput="filtrarCanales()">
    <select id="group-filter" onchange="filtrarCanales()">
      <option value="">Todas las categorías</option>
    </select>
  </div>

  <div class="channels-grid" id="grid">
    <p style="padding: 20px; color: #888;">Cargando canales y programación...</p>
  </div>

  <script>
    const ACE_SERVER_IP = '192.168.1.14';
    let listaCanales = [];
    let guiaEPG = {};
    let hls = null;

    // Limpia resoluciones, calidades, asteriscos y caracteres extra
    function normalizarNombreCanal(nombre) {
      if (!nombre) return '';
      return nombre
        .toLowerCase()
        .replace(/\b(1080p|720p|576p|4k|uhd|fhd|hd|sd|hevc|h265|multi|feed)\b/gi, '')
        .replace(/[\*\_\-\.\(\)\[\]\+]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    // Simplifica a texto alfanumérico estricto para comparaciones
    function textoPuro(str) {
      return (str || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    async function init() {
      const grid = document.getElementById('grid');
      try {
        const [resCanales, resEpg] = await Promise.allSettled([
          fetch('hashes.json?v=' + Date.now()).then(r => r.json()),
          fetch('epg.json?v=' + Date.now()).then(r => r.json())
        ]);

        if (resEpg.status === 'fulfilled' && resEpg.value) {
          guiaEPG = resEpg.value;
        }

        if (resCanales.status === 'fulfilled' && resCanales.value.hashes) {
          listaCanales = resCanales.value.hashes;
          poblarFiltroGrupos();
          renderizarCanales(listaCanales);
        } else {
          grid.innerHTML = '<p style="color:#f55; padding:20px;">No se pudieron cargar los canales.</p>';
        }
      } catch (err) {
        grid.innerHTML = '<p style="color:#f55; padding:20px;">Error de conexión general.</p>';
      }
    }

    function obtenerInfoEPG(canal) {
      if (!guiaEPG || Object.keys(guiaEPG).length === 0) return 'Directo';

      // 1. Obtener nombre limpio del canal
      const nombreLimpio = normalizarNombreCanal(canal.tvg_id || canal.title);
      const nombrePuro = textoPuro(nombreLimpio);

      if (!nombrePuro) return 'Emisión en directo';

      // 2. Buscar la mejor coincidencia en las claves de la EPG
      const epgKeys = Object.keys(guiaEPG);
      
      // Coincidencia exacta o parcial
      let keyCoincidente = epgKeys.find(k => {
        const kPuro = textoPuro(k);
        return kPuro === nombrePuro;
      });

      if (!keyCoincidente) {
        keyCoincidente = epgKeys.find(k => {
          const kPuro = textoPuro(k);
          return kPuro.includes(nombrePuro) || nombrePuro.includes(kPuro);
        });
      }

      if (!keyCoincidente || !Array.isArray(guiaEPG[keyCoincidente])) {
        return 'Emisión en directo';
      }

      // 3. Obtener el evento según la hora actual
      const ahora = new Date();
      const eventos = guiaEPG[keyCoincidente];

      const actual = eventos.find(ev => {
        const ini = new Date(ev.start || ev.inicio);
        const fin = new Date(ev.end || ev.fin);
        return ahora >= ini && ahora <= fin;
      });

      if (actual) {
        const dateIni = new Date(actual.start || actual.inicio);
        const horaIni = dateIni.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const titulo = actual.title || actual.nombre || 'Directo';
        return `${horaIni} - ${titulo}`;
      }

      return 'Emisión en directo';
    }

    function poblarFiltroGrupos() {
      const grupos = [...new Set(listaCanales.map(c => c.group).filter(Boolean))].sort();
      const select = document.getElementById('group-filter');
      select.innerHTML = '<option value="">Todas las categorías</option>';
      grupos.forEach(g => {
        const opt = document.createElement('option');
        opt.value = g;
        opt.innerText = g;
        select.appendChild(opt);
      });
    }

    function renderizarCanales(canales) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      if (canales.length === 0) {
        grid.innerHTML = '<p style="color:#aaa; padding: 20px;">No se encontraron canales.</p>';
        return;
      }

      canales.forEach(canal => {
        const epgTexto = obtenerInfoEPG(canal);
        const card = document.createElement('div');
        card.className = 'channel-card';
        card.onclick = () => reproducir(canal, epgTexto);

        const logoUrl = canal.logo || 'https://via.placeholder.com/48?text=TV';

        card.innerHTML = `
          <img class="channel-logo" src="${logoUrl}" onerror="this.src='https://via.placeholder.com/48?text=TV'" loading="lazy">
          <div class="channel-details">
            <div class="channel-title" title="${canal.title}">${canal.title}</div>
            <div class="channel-epg" title="${epgTexto}">▶ ${epgTexto}</div>
            <div class="channel-group">${canal.group || 'GENERAL'}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filtrarCanales() {
      const q = document.getElementById('search').value.toLowerCase();
      const grp = document.getElementById('group-filter').value;

      const filtrados = listaCanales.filter(c => {
        const epg = obtenerInfoEPG(c).toLowerCase();
        const coincideTexto = (c.title || '').toLowerCase().includes(q) || epg.includes(q);

        return coincideNombre && coincideGrupo;

      renderizarCanales(filtrados);
    }

    function reproducir(canal, epgTexto) {
      const video = document.getElementById('player');
      const streamUrl = `http://${ACE_SERVER_IP}:6878/ace/manifest.m3u8?id=${canal.hash}`;

      document.getElementById('now-playing').innerText = canal.title;
      document.getElementById('now-epg').innerText = epgTexto !== 'Directo' && epgTexto !== 'Emisión en directo' ? epgTexto : '';
      document.getElementById('status-badge').style.display = 'inline-block';

      window.scrollTo({ top: 0, behavior: 'smooth' });

      if (hls) hls.destroy();

      if (Hls.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        video.play();
      }
    }

    window.onload = init;
  </script>
</body>
</html>
