name: Actualizar hashes y EPG

on:
  schedule:
    # Se ejecuta automáticamente cada 2 horas
    - cron: '0 */2 * * *'
  workflow_dispatch: # Permite forzar la ejecución manual cuando quieras

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Descargar Hashes y parsear EPG
        run: |
          # 1. Descargar hashes.json con reintentos y cabeceras completas de navegador
          curl -sSL --retry 3 --retry-delay 5 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
            -H "Accept: application/json, text/plain, */*" \
            "https://git.gay/TokyoGhoulles/AceStream_IDs/raw/branch/main/hashes.json" -o temp_hashes.json

          # Validar que sea un JSON válido y que contenga hashes antes de sobreescribir
          python - << 'EOF'
          import json, os, sys
          try:
              with open('temp_hashes.json', 'r', encoding='utf-8') as f:
                  data = json.load(f)
              if 'hashes' in data and len(data['hashes']) > 0:
                  os.replace('temp_hashes.json', 'hashes.json')
                  print(f"Descargados correctamente {len(data['hashes'])} canales.")
              else:
                  print("El JSON descargado no contiene canales válidos. Se mantiene la versión anterior.")
                  sys.exit(0)
          except Exception as e:
              print(f"Error parseando temp_hashes.json: {e}. Se mantiene la versión anterior.")
              sys.exit(0)
          EOF

          # 2. Descargar guía XMLTV y convertir a epg.json
          curl -sSL "https://raw.githubusercontent.com/davidmuma/EPG_dobleM/master/guiatv.xml" -o guiatv.xml

          python - << 'EOF'
          import xml.etree.ElementTree as ET
          import json, re

          def parse_date(d_str):
              if not d_str: return None
              m = re.match(r'^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})', d_str)
              if m:
                  y, mth, d, h, mn, s = m.groups()
                  return f"{y}-{mth}-{d}T{h}:{mn}:{s}"
              return None

          try:
              tree = ET.parse('guiatv.xml')
              root = tree.getroot()

              channels = {}
              for ch in root.findall('channel'):
                  cid = ch.attrib.get('id')
                  dname = ch.find('display-name')
                  if cid and dname is not None and dname.text:
                      channels[cid] = dname.text.strip()

              epg = {}
              for prog in root.findall('programme'):
                  cid = prog.attrib.get('channel')
                  start = parse_date(prog.attrib.get('start'))
                  stop = parse_date(prog.attrib.get('stop'))
                  title_el = prog.find('title')
                  title = title_el.text.strip() if title_el is not None and title_el.text else 'Emisión'

                  if cid and start and stop:
                      keys = [cid]
                      if cid in channels:
                          keys.append(channels[cid])
                      for k in keys:
                          if k not in epg:
                              epg[k] = []
                          epg[k].append({'start': start, 'end': stop, 'title': title})

              with open('epg.json', 'w', encoding='utf-8') as f:
                  json.dump(epg, f, ensure_ascii=False)
          except Exception as e:
              print(f"Error generando epg.json: {e}")
          EOF

          rm -f guiatv.xml temp_hashes.json

      - name: Guardar y subir cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hashes.json epg.json
          # Si hay diferencias reales, hace commit y push
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update hashes and EPG"
            git push
          else
            echo "No hay cambios nuevos respecto a la última versión."
          fi
