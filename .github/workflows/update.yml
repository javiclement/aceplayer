name: Actualizar hashes y EPG

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Descargar Hashes y parsear EPG optimizada
        run: |
          # 1. Descargar hashes
          curl -sSL -A "Mozilla/5.0" "https://git.gay/TokyoGhoulles/AceStream_IDs/raw/branch/main/hashes.json" -o temp_hashes.json

          python - << 'EOF'
          import json, os, sys
          try:
              with open('temp_hashes.json', 'r', encoding='utf-8') as f:
                  data = json.load(f)
              if 'hashes' in data and len(data['hashes']) > 0:
                  os.replace('temp_hashes.json', 'hashes.json')
          except Exception as e:
              print(f"Manteniendo anterior hashes.json: {e}")
              sys.exit(0)
          EOF

          # 2. Descargar guía XMLTV y filtrar sólo eventos actuales/próximos
          curl -sSL "https://raw.githubusercontent.com/davidmuma/EPG_dobleM/master/guiatv.xml" -o guiatv.xml

          python - << 'EOF'
          import xml.etree.ElementTree as ET
          import json, re
          from datetime import datetime, timezone, timedelta

          def parse_iso(d_str):
              if not d_str: return None
              m = re.match(r'^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})', d_str)
              if m:
                  y, mth, d, h, mn, s = m.groups()
                  return f"{y}-{mth}-{d}T{h}:{mn}:{s}"
              return None

          try:
              tree = ET.parse('guiatv.xml')
              root = tree.getroot()

              channels = {}
              for ch in root.findall('channel'):
                  cid = ch.attrib.get('id')
                  dname = ch.find('display-name')
                  if cid and dname is not None and dname.text:
                      channels[cid] = dname.text.strip()

              ahora = datetime.now(timezone.utc)
              limite_pasado = ahora - timedelta(hours=2)
              limite_futuro = ahora + timedelta(hours=6)

              epg = {}
              for prog in root.findall('programme'):
                  cid = prog.attrib.get('channel')
                  raw_start = prog.attrib.get('start', '')
                  raw_stop = prog.attrib.get('stop', '')
                  
                  # Parseo rapido de fecha para comparar
                  m_start = re.match(r'^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})', raw_start)
                  m_stop = re.match(r'^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})', raw_stop)
                  if not m_start or not m_stop: continue

                  dt_start = datetime(int(m_start[1]), int(m_start[2]), int(m_start[3]), int(m_start[4]), int(m_start[5]), tzinfo=timezone.utc)
                  dt_stop = datetime(int(m_stop[1]), int(m_stop[2]), int(m_stop[3]), int(m_stop[4]), int(m_stop[5]), tzinfo=timezone.utc)

                  # Solo conservar si esta ocurriendo ahora o en las proximas horas
                  if dt_stop < limite_pasado or dt_start > limite_futuro:
                      continue

                  start = parse_iso(raw_start)
                  stop = parse_iso(raw_stop)
                  title_el = prog.find('title')
                  title = title_el.text.strip() if title_el is not None and title_el.text else 'Emisión'

                  if cid and start and stop:
                      keys = [cid]
                      if cid in channels:
                          keys.append(channels[cid])
                      for k in keys:
                          if k not in epg: epg[k] = []
                          epg[k].append({'start': start, 'end': stop, 'title': title})

              with open('epg.json', 'w', encoding='utf-8') as f:
                  json.dump(epg, f, ensure_ascii=False)
          except Exception as e:
              print(f"Error generando epg.json optimizado: {e}")
          EOF

          rm -f guiatv.xml temp_hashes.json

      - name: Guardar cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hashes.json epg.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update hashes and lightweight EPG"
            git push
          fi
